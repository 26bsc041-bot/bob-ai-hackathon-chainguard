submission:
  title: "ChainGuard AI"

  problem_statement: >
    Supply chains can be disrupted by road closures, weather,
    accidents, delays, and fleet availability issues. Operations
    teams need a simple way to identify high-risk shipments,
    understand disruption impact, and take faster corrective action.

  solution_summary: >
    ChainGuard AI is a Streamlit-based supply chain disruption
    assistant that analyses shipment risk, disruption impact,
    fleet availability, and cold-chain conditions, and provides
    actionable recommendations through an AI-style operations copilot.

  key_features:
    - "Shipment risk scoring and prioritisation"
    - "Disruption impact analysis"
    - "Fleet utilisation and redeployment recommendations"
    - "Cold-chain temperature monitoring"
    - "AI Copilot for operational queries"

  tech_stack:
    languages: ["Python"]
    frameworks: ["Streamlit", "Pandas"]
    ibm_technologies: []
    databases: []
    other: ["GitHub Actions"]

  what_we_are_most_proud_of: >
    A complete operations dashboard that combines shipment risk,
    disruption analysis, fleet recommendations, and cold-chain
    monitoring into one simple interface.

  known_limitations: >
    The current MVP uses simulated demonstration data and does not
    yet connect to live logistics systems, real-time vehicle tracking,
    external sensor feeds, or production AI services.

